services:
  - type: web
    name: medicoscope-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: medicoscope-chatbot
    runtime: python
    region: oregon
    plan: free
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Live Node API base the chatbot calls for tools/invoke, aegis/submit,
      # notifications and vitals. Must be the SAME host the Flutter app uses
      # (chatbotBaseUrl's sibling), or the forwarded JWT 401s / routes 404.
      - key: BACKEND_URL
        value: https://medicoscope-api-lbto.onrender.com/api
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
